<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<title>铸剑炉电影媒体库</title>
<style>
body{font-family:"Microsoft YaHei",sans-serif;background:#0f1117;color:#e6e6e6;margin:0;padding:20px}
h1{color:#ffd700;border-bottom:2px solid #333;padding-bottom:10px}
.count{color:#888;margin:8px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:#1a1d27;border:1px solid #2a2e3d;border-radius:10px;padding:14px;transition:transform .15s}
.card:hover{transform:translateY(-3px);border-color:#ffd700}
.title{font-size:15px;font-weight:bold;margin-bottom:8px;word-break:break-all}
.meta{color:#888;font-size:12px;margin-bottom:10px}
.play{display:inline-block;background:#ffd700;color:#000;text-decoration:none;padding:6px 16px;border-radius:6px;font-weight:bold}
.play:hover{background:#ffed4a}
.empty{color:#ff6b6b;font-size:16px;padding:40px;text-align:center}
.note{color:#888;font-size:13px;margin-top:20px;border-top:1px solid #333;padding-top:10px}
</style></head><body>
<h1>🎬 铸剑炉电影媒体库</h1>
<div class="count">共 0 部影片</div>
<div class="grid"><div class="empty">未扫描到影片 —— 请先在 config.json 里填入你的电影目录</div></div>
<div class="note">提示：点击"播放"用系统默认播放器打开。目录配置见 config.json 的 media_dirs。</div>
</body></html>
